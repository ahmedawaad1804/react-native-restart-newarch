name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - name: Lint files
        run: yarn lint
      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - name: Build package
        run: yarn build
      - name: Check tests and lint after building
        run: |
          yarn test --maxWorkers=2
          yarn lint

  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        new-arch: ['true', 'false']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          # Install the SDK versions used by the example app.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006'
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.new-arch }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.new-arch }}-
      - name: Build Android example
        working-directory: example/android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain -PnewArchEnabled=${{ matrix.new-arch }} -PreactNativeArchitectures=arm64-v8a

  build-ios:
    runs-on: macos-latest
    env:
      RCT_NEW_ARCH_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - name: Restore CocoaPods
        id: cocoapods-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-cocoapods-v2-${{ hashFiles('example/ios/Podfile.lock', 'example/ios/Podfile', '*.podspec', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-v2-
      # Always regenerate codegen and project integration for this checkout.
      - name: Install CocoaPods
        working-directory: example/ios
        run: pod install
      - name: Cache CocoaPods
        if: steps.cocoapods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: example/ios/Pods
          key: ${{ steps.cocoapods-cache.outputs.cache-primary-key }}
      - name: Build iOS example
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild -workspace RestartExample.xcworkspace -scheme RestartExample \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
      - name: Upload iOS build log
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/ios-build.log
          if-no-files-found: ignore
